<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a1021">
<meta name="description" content="Six interactive astronomy chapters from NEXUS//04, from stellar nurseries to the observable horizon.">
<title>Cosmic Explorer · NEXUS//04</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/cosmic.css?v=2">
</head>
<body>
<header class="cx-header">
  <a class="cx-brand" href="./"><span class="cx-mark" aria-hidden="true">✧</span><span>NEXUS<span class="cx-slash">//04</span><small>Cosmic Explorer</small></span></a>
  <a class="cx-back" href="./#dash">Mission control</a>
</header>
<nav id="chapters" class="cx-chapters" aria-label="Chapters"></nav>
<main id="explorer">
  <section class="cx-stage" aria-labelledby="chapter-title">
    <div id="viewport" class="cx-viewport" role="region" aria-label="Cosmic scene. In free look use arrow keys to rotate and plus or minus to zoom." tabindex="0">
      <canvas id="diagram" aria-hidden="true"></canvas>
    </div>
    <figure id="observation" class="cx-observation" hidden>
      <img id="observation-image" alt="" decoding="async">
      <figcaption class="cx-photo-credit">
        <span id="observation-instrument"></span>
        <a id="observation-credit" target="_blank" rel="noopener"></a>
      </figcaption>
    </figure>
    <div class="cx-caption">
      <div class="cx-eyebrow" id="chapter-number">Chapter 01 / 06</div>
      <h1 id="chapter-title">Inside a Nebula</h1>
      <p id="chapter-intro">Explore clouds of gas and dust and find where a star begins.</p>
      <div class="cx-current" id="stage-beat"></div>
    </div>
    <div class="cx-modes" role="group" aria-label="Scene display">
      <button id="show-model" type="button" aria-pressed="true">Model</button>
      <button id="show-observation" type="button" aria-pressed="false" hidden>Telescope</button>
    </div>
    <div class="cx-scene-tag" id="render-mode">Interactive diagram</div>
    <div class="cx-model-labels" id="model-labels" hidden></div>
    <div class="cx-scale" id="scale" hidden></div>
    <div class="cx-viewbar">
      <div class="cx-stage-navigation" role="group" aria-label="Scene navigation">
        <button id="stage-previous" type="button" aria-label="Previous scene in viewer">←</button>
        <button id="stage-play" class="cx-primary" type="button">Play tour</button>
        <button id="stage-next" type="button" aria-label="Next scene in viewer">→</button>
      </div>
      <button id="free" type="button" aria-pressed="false">Free look</button>
      <button id="labels" type="button" aria-pressed="false">Labels</button>
      <button id="motion" type="button" aria-pressed="false">Still mode</button>
      <button id="reset" type="button">Reset view</button>
    </div>
  </section>
  <div class="cx-console">
    <section class="cx-story" aria-labelledby="beat-title">
      <div class="cx-eyebrow" id="beat-number"></div>
      <h2 id="beat-title"></h2>
      <p id="beat-copy" aria-live="polite"></p>
      <div class="cx-traverse">
        <button id="previous" type="button" aria-label="Previous scene">←</button>
        <button id="play" class="cx-primary" type="button">Play guided tour</button>
        <button id="next" type="button" aria-label="Next scene">→</button>
      </div>
      <label class="cx-timeline" for="timeline"><span>Chapter timeline</span><output id="timeline-value" for="timeline"></output><input id="timeline" type="range" min="0" max="5" step="1" value="0"></label>
      <div id="stops" class="cx-stops" aria-label="Chapter scenes"></div>
    </section>
    <section class="cx-lab" aria-label="Explore this scene">
      <div class="cx-eyebrow">Explore this scene</div>
      <div id="observation-notes" class="cx-observation-notes" hidden>
        <h2 id="observation-title"></h2>
        <p id="observation-note"></p>
        <button id="inspect-model" type="button">Explore the model</button>
      </div>
      <div id="model-controls">
        <div id="controls"></div>
        <p class="cx-reading" id="reading" aria-live="polite"></p>
      </div>
      <details>
        <summary>Science notes &amp; sources</summary>
        <p id="science"></p>
        <div id="sources"></div>
      </details>
    </section>
  </div>
  <footer class="cx-footer"><span>Models use illustrative colors, times and distances.</span><a id="next-chapter" href="#stars">Next chapter →</a></footer>
</main>
<noscript><p class="cx-noscript">Enable JavaScript to explore the six interactive chapters. <a href="https://science.nasa.gov/universe/">Explore NASA’s universe guide</a>.</p></noscript>
<script type="module" src="js/cosmic.js?v=2"></script>
</body>
</html>
