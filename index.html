<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASTRA | Mission Environments</title>
<meta name="description" content="ASTRA mission environments: Apophis, the Moon, Earth's atmosphere and Mars, built on NASA sources.">
<link rel="preload" href="fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/missions.css">
<style>html,body{margin:0;background:#030304}</style>
</head>
<body>
<div id="missions"></div>
<noscript><p style="color:#eee;font-family:sans-serif;padding:2em">This module needs JavaScript. The mission science content is in js/data.js.</p></noscript>
<script type="module">
  import { mountMissionModule } from './js/app.js';
  const id = new URLSearchParams(location.search).get('mission') || 'astra';
  mountMissionModule(document.getElementById('missions'), { mission: id });
</script>
</body>
</html>
