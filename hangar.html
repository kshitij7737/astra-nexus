<script>
(function(){
const $=id=>document.getElementById(id),T=THREE,PI=Math.PI;
const R=new T.WebGLRenderer({canvas:$('c'),antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.outputEncoding=T.sRGBEncoding;R.toneMapping=T.ACESFilmicToneMapping;
R.shadowMap.enabled=true;R.toneMappingExposure=1.15;R.shadowMap.type=T.PCFSoftShadowMap;
const S=new T.Scene(),cam=new T.PerspectiveCamera(40,1,.1,3000);

function tex(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);const t=new T.CanvasTexture(c);t.encoding=T.sRGBEncoding;t.anisotropy=8;return t;}
// environment for metal reflections
const env=tex(1024,512,(x,w,h)=>{const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#05081c');g.addColorStop(.5,'#16224d');g.addColorStop(.58,'#4f86d6');g.addColorStop(.75,'#1b4a96');g.addColorStop(1,'#0b2250');x.fillStyle=g;x.fillRect(0,0,w,h);
 const q=x.createRadialGradient(760,170,0,760,170,120);q.addColorStop(0,'#fff');q.addColorStop(.25,'rgba(255,244,214,.95)');q.addColorStop(1,'rgba(255,240,200,0)');x.fillStyle=q;x.fillRect(0,0,w,h);
 x.fillStyle='rgba(255,255,255,.55)';x.fillRect(120,80,150,40);x.fillRect(430,60,90,26);x.fillStyle='rgba(160,190,255,.35)';x.fillRect(250,300,260,60);});
env.mapping=T.EquirectangularReflectionMapping;
S.environment=new T.PMREMGenerator(R).fromEquirectangular(env).texture;
const sun=new T.DirectionalLight(0xfff1d6,2.4);sun.position.set(30,24,26);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-22,right:22,top:22,bottom:-22,near:1,far:120});sun.shadow.bias=-.0006;S.add(sun);
S.add(new T.HemisphereLight(0x6f8fff,0x1a1020,.35));const rimL=new T.DirectionalLight(0x7da2ff,1.1);rimL.position.set(-25,-8,-30);S.add(rimL);

// textures
const foilT=tex(512,512,(x,w,h)=>{x.fillStyle='#b98a2e';x.fillRect(0,0,w,h);for(let i=0;i<900;i++){x.fillStyle='hsl('+(36+Math.random()*8)+',70%,'+(38+Math.random()*34)+'%)';const px=Math.random()*w,py=Math.random()*h;x.beginPath();x.moveTo(px,py);x.lineTo(px+Math.random()*60-30,py+Math.random()*60-30);x.lineTo(px+Math.random()*60-30,py+Math.random()*60-30);x.fill();}});
const cellT=tex(360,500,(x,w,h)=>{x.fillStyle='#050b24';x.fillRect(0,0,w,h);const cw=w/4,ch=h/10;for(let i=0;i<4;i++)for(let j=0;j<10;j++){const g=x.createLinearGradient(i*cw,j*ch,(i+1)*cw,(j+1)*ch);g.addColorStop(0,'#2447b0');g.addColorStop(1,'#0e2266');x.fillStyle=g;x.fillRect(i*cw+3,j*ch+3,cw-6,ch-6);x.strokeStyle='rgba(215,200,150,.55)';for(let k=1;k<4;k++){const px=i*cw+3+(cw-6)*k/4;x.beginPath();x.moveTo(px,j*ch+3);x.lineTo(px,(j+1)*ch-3);x.stroke();}}});

const foilB=tex(512,512,(x,w,h)=>{x.fillStyle='#808080';x.fillRect(0,0,w,h);for(let i=0;i<1400;i++){const v=40+Math.random()*180|0;x.fillStyle='rgb('+v+','+v+','+v+')';const px=Math.random()*w,py=Math.random()*h;x.beginPath();x.moveTo(px,py);x.lineTo(px+Math.random()*50-25,py+Math.random()*50-25);x.lineTo(px+Math.random()*50-25,py+Math.random()*50-25);x.fill();}});
const cellB=tex(360,500,(x,w,h)=>{x.fillStyle='#000';x.fillRect(0,0,w,h);const cw=w/4,ch=h/10;for(let i=0;i<4;i++)for(let j=0;j<10;j++){x.fillStyle='#ddd';x.fillRect(i*cw+3,j*ch+3,cw-6,ch-6);x.fillStyle='#888';for(let k=1;k<4;k++)x.fillRect(i*cw+3+(cw-6)*k/4-1,j*ch+3,2,ch-6);}});
const brushT=tex(256,256,(x,w,h)=>{x.fillStyle='rgb(95,95,95)';x.fillRect(0,0,w,h);for(let i=0;i<1800;i++){const v=60+Math.random()*70|0;x.strokeStyle='rgba('+v+','+v+','+v+',.5)';x.beginPath();const y=Math.random()*h;x.moveTo(0,y);x.lineTo(w,y+Math.random()*2-1);x.stroke();}});
// materials
const std=(c,m,r,o)=>new T.MeshStandardMaterial(Object.assign({color:c,metalness:m,roughness:r},o));
const mli=std(0xffffff,.85,.32,{map:foilT,bumpMap:foilB,bumpScale:2.4}),silver=std(0xd2d8e4,1,1,{roughnessMap:brushT,bumpMap:brushT,bumpScale:.5}),black=std(0x14161c,.4,.55),
 white=std(0xf0f0f0,.15,.5,{side:T.DoubleSide}),gold=std(0xe0b04a,1,.2),cell=new T.MeshPhysicalMaterial({map:cellT,bumpMap:cellB,bumpScale:1.2,metalness:.55,roughness:.2,clearcoat:1,clearcoatRoughness:.06}),back=std(0xcfd3da,.3,.6),
 glass=std(0x2a4a80,1,.05,{emissive:0x0a2a55}),panelMats=[black,black,cell,back,black,black];
const V=(x,y,z)=>new T.Vector3(x,y,z),Y=V(0,1,0);
const Box=(w,h,d)=>new T.BoxGeometry(w,h,d),Cyl=(a,b,h,s,o)=>new T.CylinderGeometry(a,b,h,s||32,1,!!o);
function M(g,m,x,y,z,p){const o=new T.Mesh(g,m);o.position.set(x||0,y||0,z||0);if(p)p.add(o);return o;}
const CX=(r,l,m,x,y,z,p)=>{const o=M(Cyl(r,r,l),m,x,y,z,p);o.rotation.z=PI/2;return o;};
const CZ=(r,l,m,x,y,z,p)=>{const o=M(Cyl(r,r,l),m,x,y,z,p);o.rotation.x=PI/2;return o;};
function link(a,b,r,m,p){const d=b.clone().sub(a),o=M(Cyl(r,r,d.length(),8),m,0,0,0,p);o.position.copy(a).addScaledVector(d,.5);o.quaternion.setFromUnitVectors(Y,d.normalize());return o;}

const sat=new T.Group();S.add(sat);const P=[];
function part(id,name,desc,spec,ex,lab,g){g.userData={base:g.position.clone(),ex:V(...ex),lab:V(...lab)};P.push({id,name,desc,spec,g});sat.add(g);return g;}

// ---- shared mission helpers
const stow=[-PI/2,3.1,-3.1],wingPivots=[];let leds=[],cur;
function rivets(g,w,h,d){const pos=[],run=(len,f)=>{for(let u=-len/2+.25;u<len/2-.1;u+=.35)f(u);};
 for(const a of[-1,1])for(const b of[-1,1]){run(d,u=>{pos.push([a*(w/2+.11),b*h/2,u],[a*w/2,b*(h/2+.11),u]);});run(h,u=>{pos.push([a*(w/2+.11),u,b*d/2],[a*w/2,u,b*(d/2+.11)]);});run(w,u=>{pos.push([u,a*(h/2+.11),b*d/2],[u,a*h/2,b*(d/2+.11)]);});}
 const im=new T.InstancedMesh(new T.SphereGeometry(.045,6,4),silver,pos.length),o=new T.Object3D();pos.forEach((p,i)=>{o.position.set(p[0],p[1],p[2]);o.updateMatrix();im.setMatrixAt(i,o.matrix);});g.add(im);}
function shell(g,w,h,d){rivets(g,w,h,d);M(Box(w,h,d),mli,0,0,0,g);for(const a of[-1,1])for(const b of[-1,1]){M(Box(.2,.2,d+.1),silver,a*w/2,b*h/2,0,g);M(Box(.2,h+.1,.2),silver,a*w/2,0,b*d/2,g);M(Box(w+.1,.2,.2),silver,0,a*h/2,b*d/2,g);}}
function wingG(side,n,L,W,at){const w=new T.Group(),pv=[];CX(.4,.7,silver,.35,0,0,w);CX(.13,1.2,silver,1.2,0,0,w);let par=w,px=1.9;
 for(let k=0;k<n;k++){const g=new T.Group();g.position.x=px;par.add(g);M(Box(L,.09,W),panelMats,L/2,0,0,g);
  for(const z of[-W/2,W/2])M(Box(L+.1,.14,.12),silver,L/2,0,z,g);for(const x of[0,L])M(Box(.12,.14,W),silver,x,0,0,g);
  for(const z of[-W/4,W/4])M(Box(L-.2,.08,.08),silver,L/2,-.1,z,g);CZ(.09,W-.2,gold,0,0,0,g);pv.push(g);par=g;px=L+.1;}
 w.position.set(side*at,0,0);if(side<0)w.rotation.y=PI;wingPivots.push(pv);return w;}
function dishG(r){const g=new T.Group(),f=r*.75,h=r*r/(4*f),pts=[];for(let i=0;i<=12;i++){const q=r*i/12;pts.push(new T.Vector2(q,q*q/(4*f)));}
 M(new T.LatheGeometry(pts,40),white,0,0,0,g);M(new T.TorusGeometry(r,.04,8,48),gold,0,h,0,g).rotation.x=PI/2;M(Cyl(.05,.18,.35),gold,0,f,0,g);
 for(let i=0;i<3;i++){const a=i*2.094+.5;link(V(r*Math.cos(a),h,r*Math.sin(a)),V(0,f,0),.03,silver,g);}return g;}
function dishAt(g,x,y,z,r,tx){M(Cyl(.5,.6,.25),silver,x,y+.12,z,g);M(Cyl(.2,.2,.8),silver,x,y+.6,z,g);const d=dishG(r);d.position.set(x,y+1.1,z);d.rotation.x=tx;g.add(d);}
function pods(g,w,h,z){for(const a of[-1,1])for(const b of[-1,1]){const x=a*w,y=b*h;M(Box(.45,.45,.45),black,x,y,z,g);
 for(const d of[V(a,0,0),V(0,b,0),V(0,0,-1)]){const c=M(Cyl(.03,.12,.26,12),silver,x+d.x*.34,y+d.y*.34,z+d.z*.34,g);c.quaternion.setFromUnitVectors(Y,d);c.rotateX(PI);}}}
function bell(g,x,y,z,s,rx){const bp=[];for(let i=0;i<=14;i++){const t=i/14;bp.push(new T.Vector2((.2+.95*Math.pow(t,.65))*s,t*1.8*s));}
 const m=M(new T.LatheGeometry(bp,36),silver.clone(),x,y,z,g);m.material.side=T.DoubleSide;m.rotation.x=rx;return m;}
function tube(g,r1,r2,l,x,y,z){const m=M(Cyl(r1,r2,l,32,true),white,x,y,z,g);m.rotation.x=PI/2;return m;}
function G(){return new T.Group();}

// ---- ASTRA: Apophis encounter, OSIRIS-APEX heritage
function buildAstra(){
 const b=G();shell(b,3,3,3.6);
 part('bus','Spacecraft bus','Main body with computer, battery, recorder and radio. Inspired by NASA’s OSIRIS-APEX (formerly OSIRIS-REx). ASTRA is a fictional student mission, not an official NASA spacecraft.',['Game bus: 160 kg, 180 W, 250 credits (game value)','Not a real spacecraft specification'],[0,0,0],[1.5,1.2,1.8],b);
 for(const s of[1,-1])part(s>0?'wR':'wL',s>0?'Solar array, starboard':'Solar array, port','Two solar arrays, as on the reference spacecraft. Power falls with distance from the Sun: P = rating × 0.8 ÷ d².',['Game arrays: 1,200 W / 20 kg / 80 credits or 1,800 W / 30 kg / 140 credits (game values)'],[s*7,0,0],[5,0,0],wingG(s,2,3.2,3.6,1.5));
 let g=G();dishAt(g,0,1.5,-.3,1.6,.7);
 part('dish','High-gain antenna','Sends maps and measurements home. Data returned = rate × 0.8 × contact time.',['Game radios: 2 Mb/s, 80 W, 15 kg, 60 credits or 20 Mb/s, 100 W, 20 kg, 120 credits (game values)'],[0,4,0],[0,3.3,.3],g);
 g=G();for(const x of[-.9,0]){M(Box(.7,.7,.7),black,x,.8,2.1,g);CZ(.22,.1,glass,x,.8,2.5,g);}
 part('ocams','OCAMS camera suite','Maps Apophis and helps navigate close to its surface. Heritage: OSIRIS-REx OCAMS.',['Mapping and navigation'],[0,3,3],[-.45,.8,2.6],g);
 g=G();CZ(.3,.9,black,.9,-.6,2.3,g);CZ(.2,.1,glass,.9,-.6,2.8,g);
 part('ola','OLA laser altimeter','Fires a laser to measure the 3D shape of the surface. Heritage: OSIRIS-REx OLA.',['3D surface shape'],[3,0,3],[.9,-.6,2.9],g);
 g=G();CZ(.35,1.3,silver,.9,.8,2.5,g);CZ(.25,.1,glass,.9,.8,3.2,g);
 part('ovirs','OVIRS spectrometer','A visible and infrared spectrometer that reads the surface minerals. Heritage: OSIRIS-REx OVIRS.',['Surface composition'],[3,3,3],[.9,.8,3.3],g);
 g=G();M(Box(.9,.7,.9),silver,-.9,-.6,2.2,g);CZ(.28,.1,gold,-.9,-.6,2.7,g);
 part('otes','OTES thermal spectrometer','Measures the heat the surface gives off. Heritage: OSIRIS-REx OTES.',['Surface heat'],[-3,-1,3],[-.9,-.6,2.8],g);
 g=G();const a1=V(0,-1.5,1.8),a2=V(0,-1.4,4.2),a3=V(0,-.5,5.5);link(a1,a2,.09,silver,g);link(a2,a3,.09,silver,g);
 for(const p of[a1,a2,a3])M(new T.SphereGeometry(.2,16,16),gold,p.x,p.y,p.z,g);
 M(Cyl(.7,.55,.6,28,true),white,0,-.5,5.8,g).rotation.x=PI/2;M(Cyl(.5,.5,.05),black,0,-.5,5.5,g).rotation.x=PI/2;
 part('arm','Sampling arm','Based on OSIRIS-REx sample collection hardware (NASA fact). OSIRIS-REx returned its Bennu sample in 2023. In the game you decide whether to fire thrusters near the surface to expose material.',['Fictional use at Apophis'],[0,-3,4],[0,-.5,5.8],g);
 g=G();bell(g,0,0,-1.8,.8,-PI/2);M(Cyl(1.3,1.45,.4,40,true),silver.clone(),0,0,-1.95,g).rotation.x=PI/2;M(new T.TorusGeometry(1.4,.06,8,40),silver,0,0,-2.15,g);
 part('eng','Propulsion','Δv = Isp × g0 × ln(wet mass ÷ dry mass). Too little propellant and you fly past the target.',['Game launch: 550 kg wet / 180 credits or 750 kg / 240 credits','Propellant hardware: 40 kg, 60 credits (game values)'],[0,0,-5],[0,0,-3.3],g);
 g=G();pods(g,1.6,1.6,-1.5);part('rcs','Thruster pods','Small thrusters for fine corrections and for reaction wheel faults in the game.',['Game fault: reaction-wheel problem'],[0,0,-3],[1.6,1.6,-1.8],g);
 g=G();for(const s of[-1,1]){M(Box(.5,.4,.5),black,s,1.75,1.2,g);M(Cyl(.3,.18,.45,16,true),white,s,2.15,1.2,g);}
 part('sen','Star trackers','Find which way the spacecraft points from star patterns.',['Illustrative'],[0,3,2],[1,2.1,1.2],g);
}

// ---- LUNARIS: lunar polar orbiter, LRO heritage
function buildLuna(){
 const b=G();shell(b,3,2.6,3.6);M(Box(2.8,.15,3.2),silver,0,-1.7,0,b);
 part('bus','Spacecraft bus','Main body with computer, battery, recorder and radio. Inspired by NASA’s Lunar Reconnaissance Orbiter (LRO, launched June 2009). LUNARIS is a fictional student mission.',['Game bus: 160 kg, 180 W, 250 credits (game value)','Not a real spacecraft specification'],[0,0,0],[1.5,1,1.8],b);
 part('wR','Solar array','A solar array. In the shadow the battery takes over.',['Game arrays: 1,200 W or 1,800 W','Game batteries: 100 Wh or 500 Wh (game values)'],[7,0,0],[5,0,0],wingG(1,2,3.2,3.2,1.5));
 let g=G();dishAt(g,0,1.3,-1,1.6,.6);
 part('dish','High-gain antenna','Sends data to Earth. The game can reduce ground-antenna availability.',['Game radios: 2 or 20 Mb/s (game values)'],[0,4,0],[0,3.2,-.6],g);
 g=G();for(const x of[-1,-.5]){M(Cyl(.2,.22,1.5),black,x,-2.55,.9,g);M(Cyl(.3,.2,.3,20,true),white,x,-3.4,.9,g);}M(Box(.4,.4,.4),black,-.75,-2.2,1.5,g);
